name: Previsualización del PR

# Publica un enlace donde ver los cambios antes de mergear, y deja las capturas
# de las tres pantallas como evidencia adjunta al PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Publicar la demostración a demanda, sin PR de por medio. Es lo que hace
  # falta para enseñar la plataforma: un enlace estable desde `main`.
  workflow_dispatch:

# Un PR nuevo cancela la previsualización anterior: no tiene sentido gastar
# minutos publicando un commit que ya quedó atrás.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Actions usa `bash -e {0}`, sin `pipefail`: en `wrangler ... | tee salida.txt` el
# código de salida era el de `tee`, así que una subida fallida seguía adelante y
# solo se notaba más tarde, al no encontrar la URL.
defaults:
  run:
    shell: bash

env:
  NEXT_PUBLIC_SUPABASE_URL: ''
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

jobs:
  # ---------------------------------------------------------------------------
  # Capturas: funciona sin ninguna credencial. Es la previsualización que hay
  # disponible desde el primer día, mientras la cuenta de Cloudflare no exista.
  # ---------------------------------------------------------------------------
  capturas:
    name: Capturas en móvil, tablet y escritorio
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @nebula/tests exec playwright install --with-deps chromium

      # Sin Supabase configurado la tienda arranca con el contenido de
      # demostración, que es justo lo que se quiere previsualizar en un PR.
      - name: Construir la tienda
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
        run: pnpm --filter @nebula/storefront build

      - name: Levantar la tienda
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
        run: |
          nohup pnpm --filter @nebula/storefront exec next start --port 4321 > /tmp/tienda.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4321/; then
              echo "Tienda arriba"; exit 0
            fi
            sleep 2
          done
          echo "::error::La tienda no respondió en 60 segundos"; exit 1

      - name: Capturar la tienda
        env:
          E2E_BASE_URL: http://127.0.0.1:4321
        run: pnpm --filter @nebula/tests capturas

      # El panel es la mitad de la propuesta y hasta ahora no salía en ninguna
      # captura: sin base de datos devolvía 500 en todas sus pantallas. Con el
      # recorrido de demostración ya se puede retratar entero.
      - name: Construir y levantar el panel
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
        run: |
          pnpm --filter @nebula/admin build
          nohup pnpm --filter @nebula/admin exec next start --port 4400 > /tmp/panel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4400/entrar; then
              echo "Panel arriba"; exit 0
            fi
            sleep 2
          done
          echo "::error::El panel no respondió en 60 segundos"; cat /tmp/panel.log; exit 1

      - name: Capturar el panel
        env:
          PANEL_BASE_URL: http://127.0.0.1:4400
        run: pnpm --filter @nebula/tests capturas:panel

      - uses: actions/upload-artifact@v4
        id: subida
        with:
          name: capturas-${{ github.event.pull_request.number || github.run_id }}
          path: docs/previsualizacion/**/*.png
          retention-days: 14

      - name: Comentar en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marca = '<!-- nebula-capturas -->';
            const url = '${{ steps.subida.outputs.artifact-url }}';
            const cuerpo = [
              marca,
              '### Previsualización visual',
              '',
              `**[Descargar las capturas](${url})** — portada, catálogo, carrito y checkout en escritorio, tablet y móvil.`,
              '',
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
            ].join('\n');

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previo = comentarios.find((c) => c.body?.includes(marca));

            // Se edita el comentario existente en lugar de apilar uno por commit.
            if (previo) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previo.id,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: cuerpo,
              });
            }

  # ---------------------------------------------------------------------------
  # Enlace en vivo: requiere cuenta de Cloudflare. Mientras no existan los
  # secretos, el trabajo se salta con un aviso claro en lugar de fallar el PR.
  # ---------------------------------------------------------------------------
  credenciales:
    name: ¿Hay credenciales de Cloudflare?
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      hay: ${{ steps.check.outputs.hay }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin CLOUDFLARE_API_TOKEN ni CLOUDFLARE_ACCOUNT_ID: se omite el enlace en vivo. Ver docs/DESPLIEGUE.md."
          fi

  enlace:
    name: Publicar previsualización en Cloudflare
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: credenciales
    if: needs.credenciales.outputs.hay == 'true'
    strategy:
      matrix:
        app: [storefront, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Se construye SIN las variables de Supabase, y no por falta de ellas:
      #
      #  * Con base de datos, el panel exige iniciar sesión. Quien abra el
      #    enlace vería la pantalla de acceso y nada más — justo lo contrario
      #    de lo que una previsualización tiene que enseñar.
      #  * Un enlace público contra la base de staging es una superficie de
      #    ataque sin motivo. En modo demostración no hay base que atacar.
      #  * Y así la previsualización necesita DOS secretos, no cuatro.
      #
      # El bloque `env` del workflow ya las deja vacías; se repiten aquí porque
      # `NEXT_PUBLIC_*` se incrusta en tiempo de build y este es el paso que
      # construye.
      - name: Construir para Workers (modo demostración)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PREVIEW_SITE_URL || 'https://preview.example.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
        run: pnpm --filter @nebula/${{ matrix.app }} cf:build

      # `versions upload` sube una versión SIN promoverla a producción, y el
      # alias mantiene el mismo enlace mientras se añaden commits al PR.
      - name: Subir versión de previsualización
        id: subir
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          alias="pr-${{ github.event.pull_request.number || 'demo' }}"

          # `versions upload` sube una versión de un Worker QUE YA EXISTE. En una
          # cuenta recién creada no existe ninguno, así que la primera ejecución
          # fallaría con "workers.api.error.not_found" y nadie sabría por qué.
          # Un `deploy` inicial lo crea; a partir de ahí, todo son versiones.
          if ! pnpm exec wrangler versions upload --preview-alias "$alias" | tee salida.txt; then
            echo "::notice::El Worker no existía todavía. Se crea con un despliegue inicial."
            pnpm exec wrangler deploy
            pnpm exec wrangler versions upload --preview-alias "$alias" | tee salida.txt
          fi

          # Sin URL, el paso siguiente avisa y sigue: eso es a propósito, así que
          # aquí no se aborta (con `pipefail`, un grep sin coincidencias lo haría).
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "alias=${alias}" >> "$GITHUB_OUTPUT"

          {
            echo "### ${{ matrix.app }}"
            echo ""
            echo "${url:-sin URL: revisa la salida de wrangler}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar el enlace en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          APP: ${{ matrix.app }}
          URL: ${{ steps.subir.outputs.url }}
        with:
          script: |
            const app = process.env.APP;
            const url = process.env.URL;
            if (!url) {
              core.warning(`No se pudo extraer la URL de previsualización de ${app}`);
              return;
            }

            const marca = `<!-- nebula-preview-${app} -->`;
            const nombre = app === 'storefront' ? 'Tienda' : 'Panel administrativo';
            const cuerpo = [
              marca,
              `### ${nombre} — previsualización en vivo`,
              '',
              `**${url}**`,
              '',
              'El enlace no cambia mientras se añadan commits a este PR.',
              'Es una versión subida, no desplegada: producción no se toca.',
            ].join('\n');

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previo = comentarios.find((c) => c.body?.includes(marca));

            if (previo) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previo.id,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: cuerpo,
              });
            }
