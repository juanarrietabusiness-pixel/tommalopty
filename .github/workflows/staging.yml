name: Publicar en staging

# Despliega las dos aplicaciones conectadas a la base de datos de staging, en
# las URL `workers.dev` de Cloudflare. **No hace falta dominio propio.**
#
# Es distinto de `preview.yml`, y la diferencia importa:
#
#   * `preview.yml` publica en MODO DEMOSTRACIÓN, sin base de datos. Sirve para
#     enseñar el diseño, pero nada se guarda: subir una imagen, crear una
#     variante o editar un menú responden «esto es un recorrido de
#     demostración».
#   * Este workflow publica contra la base de STAGING. Ahí sí se guarda, así que
#     es el único sitio donde se puede comprobar que lo construido funciona de
#     verdad.
#
# Se lanza a mano: publicar es una acción deliberada, no algo que deba pasar
# solo al empujar código.

on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a publicar'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  requisitos:
    name: ¿Están los secretos?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
      supabase: ${{ steps.check.outputs.supabase }}
      service_role: ${{ steps.check.outputs.service_role }}
      correo: ${{ steps.check.outputs.correo }}
      clave_maestra: ${{ steps.check.outputs.clave_maestra }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SB_ANON: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          SB_SERVICE: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          RESEND: ${{ secrets.STAGING_RESEND_API_KEY }}
          FROM: ${{ vars.STAGING_EMAIL_FROM }}
          CLAVE_MAESTRA: ${{ secrets.CREDENCIALES_CLAVE_MAESTRA }}
        run: |
          if [ -n "$CLAVE_MAESTRA" ]; then
            echo "clave_maestra=si" >> "$GITHUB_OUTPUT"
          else
            echo "clave_maestra=no" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=si" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=no" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$SB_URL" ] && [ -n "$SB_ANON" ]; then
            echo "supabase=si" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=no" >> "$GITHUB_OUTPUT"
          fi

          # El checkout crea el pedido con service-role porque quien compra
          # puede ser invitado y no tiene sesión que RLS pueda autorizar. Sin
          # esta clave todo lo demás funciona y solo falla confirmar un pedido.
          if [ -n "$SB_SERVICE" ]; then
            echo "service_role=si" >> "$GITHUB_OUTPUT"
          else
            echo "service_role=no" >> "$GITHUB_OUTPUT"
          fi

          # El correo transaccional necesita las dos: la clave para poder
          # enviar, y el remitente porque Resend rechaza un envío sin `from`
          # verificado. Con una sola de las dos no se manda nada, así que se
          # comprueban juntas y no por separado.
          if [ -n "$RESEND" ] && [ -n "$FROM" ]; then
            echo "correo=si" >> "$GITHUB_OUTPUT"
          else
            echo "correo=no" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    name: Publicar ${{ matrix.app }}
    needs: requisitos
    if: needs.requisitos.outputs.cloudflare == 'si' && needs.requisitos.outputs.supabase == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, admin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # `NEXT_PUBLIC_*` se incrusta en el bundle en tiempo de build, así que
      # tiene que ir aquí y no en el despliegue.
      #
      # La anon key es pública por diseño: viaja en el navegador de cualquiera
      # que abra la tienda, y lo que protege los datos es RLS, no el secreto de
      # esta clave. Por eso va como `vars` y no como `secrets`.
      - name: Construir contra la base de staging
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          NEXT_PUBLIC_BRAND_NAME: ${{ vars.STAGING_BRAND_NAME || 'Nébula Store' }}
        run: pnpm --filter @nebula/${{ matrix.app }} cf:build

      # Los secretos de ejecución van al Worker, no al bundle. Se cargan antes
      # de desplegar para que la primera versión ya los tenga.
      - name: Cargar los secretos del Worker
        if: needs.requisitos.outputs.service_role == 'si'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ROLE: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # `wrangler secret put` sobre un Worker que aún no existe falla. En ese
          # caso se deja para después del despliegue, que es cuando existirá.
          if printf '%s' "$SERVICE_ROLE" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY; then
            echo "Secreto cargado."
          else
            echo "::notice::El Worker aún no existe; el secreto se carga tras el primer despliegue."
          fi


      - name: Desplegar
        id: desplegar
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy | tee salida.txt
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Segundo intento, para la primera vez: ahora el Worker ya existe.
      - name: Cargar los secretos del Worker (reintento)
        if: needs.requisitos.outputs.service_role == 'si'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ROLE: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: printf '%s' "$SERVICE_ROLE" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      # Va después de desplegar y no antes, como el resto de secretos de
      # ejecución: `wrangler secret put` sobre un Worker que todavía no existe
      # falla, y aquí ya existe seguro.
      #
      # Los tres se cargan como secretos del Worker aunque solo la clave lo sea.
      # En un Worker las `vars` son valores estáticos del `wrangler.jsonc` —es
      # decir, comprometidos en el repositorio— y el remitente cambia por
      # entorno. La distinción sí se respeta del lado de GitHub, que es donde
      # importa: la clave se enmascara en los registros y las otras dos no.
      #
      # Sin estas variables la tienda funciona entera: `resendProvider` devuelve
      # `email_not_configured` y quien llama lo trata como caso normal. Por eso
      # esto no bloquea el despliegue.
      - name: Cargar la configuración de correo
        if: needs.requisitos.outputs.correo == 'si'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.STAGING_EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ vars.STAGING_EMAIL_REPLY_TO }}
        run: |
          printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY
          printf '%s' "$EMAIL_FROM" | pnpm exec wrangler secret put EMAIL_FROM
          if [ -n "$EMAIL_REPLY_TO" ]; then
            printf '%s' "$EMAIL_REPLY_TO" | pnpm exec wrangler secret put EMAIL_REPLY_TO
          fi

      # La clave maestra de la bóveda de credenciales.
      #
      # Va después de desplegar por lo mismo que las demás: `wrangler secret put`
      # sobre un Worker que no existe falla.
      #
      # Sin ella, la tienda y el panel funcionan igual y siguen leyendo las
      # credenciales de las variables de entorno, como antes de que la bóveda
      # existiera. Lo que no funciona es pegar una credencial desde el panel: se
      # queda bloqueado con un aviso que lo dice. Por eso esto no detiene el
      # despliegue — pero si falta, la bóveda es una pantalla que no sirve.
      - name: Cargar la clave maestra de credenciales
        if: needs.requisitos.outputs.clave_maestra == 'si'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAVE_MAESTRA: ${{ secrets.CREDENCIALES_CLAVE_MAESTRA }}
        run: printf '%s' "$CLAVE_MAESTRA" | pnpm exec wrangler secret put CREDENCIALES_CLAVE_MAESTRA

      - name: Resumen
        env:
          APP: ${{ matrix.app }}
          CLAVE_MAESTRA: ${{ needs.requisitos.outputs.clave_maestra }}
          URL: ${{ steps.desplegar.outputs.url }}
          SERVICE: ${{ needs.requisitos.outputs.service_role }}
          CORREO: ${{ needs.requisitos.outputs.correo }}
        run: |
          {
            echo "## ${APP} publicado en staging"
            echo
            if [ -n "$URL" ]; then
              echo "**${URL}**"
            else
              echo "Desplegado. La URL no se pudo extraer de la salida; está en el panel de Cloudflare."
            fi
            echo
            echo "Conectado a la base de datos de staging: aquí **sí se guarda** lo que se edite."
            if [ "$SERVICE" != "si" ]; then
              echo
              echo "> Falta el secreto \`STAGING_SUPABASE_SERVICE_ROLE_KEY\`."
              echo "> Todo funciona salvo confirmar un pedido en el checkout."
            fi
            if [ "$CLAVE_MAESTRA" != "si" ]; then
              echo
              echo "> Falta el secreto \`CREDENCIALES_CLAVE_MAESTRA\`."
              echo "> La pantalla de Integraciones no deja pegar credenciales sin él,"
              echo "> y todo sigue leyéndolas de las variables de entorno. Se genera con"
              echo "> \`node -e \"console.log(require('crypto').randomBytes(32).toString('base64'))\"\`."
              echo "> Los pasos están en \`docs/CONECTAR.md\` § 9."
            fi
            if [ "$CORREO" != "si" ]; then
              echo
              echo "> Sin correo transaccional: faltan \`STAGING_RESEND_API_KEY\` (secreto)"
              echo "> y \`STAGING_EMAIL_FROM\` (variable). Necesitan un dominio verificado"
              echo "> en Resend; los pasos están en \`docs/PLAN-LOGISTICA.md\` § 2.e."
              echo "> La tienda funciona: simplemente no avisa a nadie."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  faltan_secretos:
    name: Qué falta configurar
    needs: requisitos
    if: needs.requisitos.outputs.cloudflare == 'no' || needs.requisitos.outputs.supabase == 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CF: ${{ needs.requisitos.outputs.cloudflare }}
          SB: ${{ needs.requisitos.outputs.supabase }}
        run: |
          {
            echo "## Falta configuración"
            echo
            echo "En **Settings → Secrets and variables → Actions**:"
            echo
            if [ "$CF" = "no" ]; then
              echo "### Secrets"
              echo "- \`CLOUDFLARE_API_TOKEN\`"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\`"
            fi
            if [ "$SB" = "no" ]; then
              echo "### Variables"
              echo "- \`STAGING_SUPABASE_URL\`"
              echo "- \`STAGING_SUPABASE_ANON_KEY\`"
              echo
              echo "Los valores están en docs/DESPLIEGUE.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Faltan secretos o variables. Ver el resumen de la ejecución."
          exit 1
