# Configuración de Supabase local (supabase start / supabase db reset).
project_id = "nebula-commerce"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Supabase pasó de Postgres 15 a 17: la 16 no es una versión válida aquí.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

# Supabase Storage queda apagado a propósito: las imágenes y el video viven en
# Cloudflare R2 y Stream, no aquí. Había dos opciones escritas a la vez —el ADR
# 0002 decía R2 y este archivo declaraba buckets de Supabase— y ganaba la que se
# implementara primero. La decisión está cerrada en
# docs/adr/0007-media-en-cloudflare.md: Supabase se queda con la base de datos y
# las cuentas; todo lo que se sirve al navegador, en Cloudflare.
[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
